    let currentPokemon = null;
    let currentNature = { up: 1, down: 1, name: '노력' };

    function renderResults(results) {
      searchResults.innerHTML = '';
      if (results.length === 0) {
        searchResults.classList.add('hidden');
        return;
      }
      results.forEach((pokemon) => {
        const li = document.createElement('li');
        li.className = 'px-3 py-3 text-xs font-label cursor-pointer hover:bg-surface-variant transition-colors border-b border-outline-variant/30 last:border-0 uppercase';
        li.textContent = pokemon.n;
        li.addEventListener('click', () => selectPokemon(pokemon));
        searchResults.appendChild(li);
      });
      searchResults.classList.remove('hidden');
    }

    function selectPokemon(pokemon) {
      currentPokemon = pokemon;
      searchInput.value = pokemon.n;
      searchResults.classList.add('hidden');
      selectedPokemonName.textContent = pokemon.n;
      updateStats();
      statsDisplay.style.display = 'block';
      placeholderText.style.display = 'none';
    }

    // 스탯 계산 및 화면 업데이트 함수
    function updateStats() {
      if (!currentPokemon) return;
      
      const spInputs = document.querySelectorAll('.sp-input');
      const statIds = ['hp', 'atk', 'def', 'spa', 'spd', 'spe'];
      let totalValue = 0;
      
      currentPokemon.s.forEach((baseStat, index) => {
        const spVal = parseInt(spInputs[index].value) || 0;
        let finalStat = baseStat + spVal;
        
        // 1. 성격 보정 적용 (HP 제외)
        if (index > 0) {
          if (index === currentNature.up && index !== currentNature.down) {
            finalStat = Math.floor(finalStat * 1.1); // 상승 1.1배
          } else if (index === currentNature.down && index !== currentNature.up) {
            finalStat = Math.floor(finalStat * 0.9); // 하락 0.9배
          }
        }
        
        // 2. 아이템 보정 적용 (스피드 스카프: index 5)
        if (index === 5 && itemSelect.value === '구애스카프') {
          finalStat = Math.floor(finalStat * 1.5); // 스피드 1.5배
        }
        
        totalValue += finalStat;
        document.getElementById(`stat-val-${statIds[index]}`).textContent = finalStat;
        const barWidth = Math.min((finalStat / 250) * 100, 100);
        const bar = document.getElementById(`stat-bar-${statIds[index]}`);
        if(bar) bar.style.width = `${barWidth}%`;
      });
      
      document.getElementById('total-base-stats').textContent = totalValue;
    }

        renderResults(filtered);
      } else {
        searchResults.classList.add('hidden');

    });

    document.addEventListener('click', (e) => {
      if (!document.getElementById('search-container').contains(e.target)) {
        searchResults.classList.add('hidden');
      }
    });

    // 아이템 선택 시 계산식 즉시 재적용
    itemSelect.addEventListener('change', updateStats);

    // Nature Logic
    const buttons = document.querySelectorAll('.nature-btn');
    buttons.forEach(btn => {
      btn.addEventListener('click', function() {
        buttons.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentNature.up = parseInt(this.getAttribute('data-up'));
        currentNature.down = parseInt(this.getAttribute('data-down'));
        currentNature.name = this.getAttribute('data-name');
        updateStats();
      });
    });

    // SP Input Logic
    const spInputs = document.querySelectorAll('.sp-input');
    const spTotalText = document.getElementById('sp-total-text');
    const spTotalBar = document.getElementById('sp-total-bar');

    spInputs.forEach(input => {
      input.addEventListener('input', function() {
        let val = parseInt(this.value) || 0;
        if (val < 0) val = 0;
        if (val > 32) val = 32;
        this.value = val;
        
        let currentSum = 0;
        spInputs.forEach(inp => currentSum += (parseInt(inp.value) || 0));
        
        if (currentSum > 66) {
          const excess = currentSum - 66;
          val -= excess;
          this.value = Math.max(0, val);
          currentSum = 66;
        }
        
        spTotalText.textContent = `TOTAL ${currentSum} / 66`;
        spTotalBar.style.width = `${(currentSum / 66) * 100}%`;
        updateStats();
      });
    });

    // SAVE Button Logic (성격 + 스카프 계산된 실수치 저장)
    saveBtn.addEventListener('click', () => {
      if (!currentPokemon) {
        alert('포켓몬을 선택해주세요.');
        return;
      }

      const spAllocation = {
        hp: parseInt(document.querySelector('[data-label="HP"]').value) || 0,
        atk: parseInt(document.querySelector('[data-label="Attack"]').value) || 0,
        def: parseInt(document.querySelector('[data-label="Defense"]').value) || 0,
        spa: parseInt(document.querySelector('[data-label="Sp. Atk"]').value) || 0,
        spd: parseInt(document.querySelector('[data-label="Sp. Def"]').value) || 0,
        spe: parseInt(document.querySelector('[data-label="Speed"]').value) || 0
      };

      const entry = {
        id: Date.now().toString(),
        name: currentPokemon.n,
        nature: currentNature.name,
        sp: spAllocation,
        stats: {
          hp: document.getElementById('stat-val-hp').textContent,
          atk: document.getElementById('stat-val-atk').textContent,
          def: document.getElementById('stat-val-def').textContent,
          spa: document.getElementById('stat-val-spa').textContent,
          spd: document.getElementById('stat-val-spd').textContent,
          spe: document.getElementById('stat-val-spe').textContent
        },
        item: itemSelect.value,
        date: new Date().toLocaleDateString()
      };

      let existingData = JSON.parse(localStorage.getItem('pokemon_saves') || '[]');
      existingData.push(entry);
      localStorage.setItem('pokemon_saves', JSON.stringify(existingData));
      
      window.location.href = '저장소.html'; 
    });
</script>
<!-- END: ApplicationLogic -->
</body></html>
