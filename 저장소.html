<script>
        const STORAGE_KEY = 'pokemon_saves';

        function getStoredData() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveToStorage(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function deleteEntry(id) {
            if (!confirm('정말 이 데이터를 삭제하시겠습니까?')) return;
            const data = getStoredData();
            // Update 3: Compare using toString() for robustness
            const filteredData = data.filter(item => item.id.toString() !== id.toString());
            saveToStorage(filteredData);
            renderData();
        }

        function renderData() {
            const container = document.getElementById('data-container');
            const emptyState = document.getElementById('empty-state');
            const data = getStoredData();
            
            // Clear existing dynamic entries
            const existingEntries = container.querySelectorAll('.dynamic-entry');
            existingEntries.forEach(el => el.remove());

            if (data.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            // Update 1 & 5: Using specific item keys and card layout
            data.forEach(item => {
                const card = document.createElement('section');
                card.className = 'dynamic-entry bg-surface-container-low border border-outline-variant rounded overflow-hidden shadow-xl flex flex-col mb-6';
                
                const statLabels = {
                    hp: '체력',
                    atk: '공격',
                    def: '방어',
                    spa: '특공',
                    spd: '특방',
                    spe: '스피드'
                };

                // Grid of calculated stats (item.stats)
                const statsHtml = Object.entries(item.stats || {}).map(([key, val]) => `
                    <div class="flex justify-between items-center py-1.5 border-b border-outline-variant/10">
                        <span class="font-label text-[10px] text-outline uppercase">${statLabels[key] || key}</span>
                        <span class="font-label text-xs font-bold text-on-surface">${val}</span>
                    </div>
                `).join('');

                // Update 2: Filter SP values > 0
                const spPillsHtml = Object.entries(item.sp || {})
                    .filter(([_, v]) => v > 0)
                    .map(([k, v]) => `
                        <div class="bg-surface-container-highest/40 px-2 py-0.5 rounded border border-outline-variant/20 flex items-center gap-1.5">
                            <span class="font-label text-[9px] text-outline uppercase">${statLabels[k] || k}</span>
                            <span class="font-label text-[10px] font-bold text-primary">${v}</span>
                        </div>
                    `).join('');

                card.innerHTML = `
                    <div class="p-4 space-y-4 relative pt-6">
                        <div class="flex justify-between items-center mb-1">
                            <div class="px-2 py-0.5 bg-surface-container-lowest/80 border border-outline-variant rounded text-[10px] font-label text-primary/70 uppercase">UID: ${item.id}</div>
                            <button onclick="deleteEntry('${item.id}')" class="text-on-surface-variant hover:text-error transition-colors p-1">
                                <span class="material-symbols-outlined text-lg">delete</span>
                            </button>
                        </div>
                        
                        <div class="flex justify-between items-start">
                            <div>
                                <h2 class="font-display text-2xl font-bold text-primary tracking-tight leading-tight">${item.name}</h2>
                                <p class="font-label text-[10px] text-primary/60 uppercase mt-0.5">NATURE: ${item.nature || '신중'}</p>
                            </div>
                            <p class="font-label text-[9px] text-outline uppercase mt-2">MOD: ${item.date || new Date().toLocaleDateString()}</p>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-x-6 gap-y-0.5 bg-surface-container-lowest/40 p-3 rounded border border-outline-variant/30">
                            ${statsHtml}
                        </div>

                        <div class="space-y-2">
                            <p class="font-label text-[9px] text-outline uppercase opacity-60">SP_ALLOCATION</p>
                            <div class="flex flex-wrap gap-1.5">
                                ${spPillsHtml || '<span class="text-[10px] text-outline/50 italic font-label">NO_SP_ALLOCATED</span>'}
                            </div>
                        </div>

                        <button class="w-full bg-primary text-surface-container-lowest py-3 rounded font-label text-xs font-bold uppercase hover:bg-primary/90 transition-all active:scale-[0.98] flex items-center justify-center gap-2 mt-2">
                            <span class="material-symbols-outlined text-sm">download</span> LOAD_DATA
                        </button>
                    </div>`;
                container.appendChild(card);
            });
        }

        window.addEventListener('DOMContentLoaded', renderData);
    </script>
